name: "FreeBSD Test"
description: "Reusable freebsd test action"

runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: the-wireguard-effect
        path: /tmp/the-wireguard-effect

    - shell: bash
      run: tar -xvf /tmp/the-wireguard-effect/the-wireguard-effect.tar

    - uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
      with:
        usesh: true
        sync: rsync
        copyback: false
        prepare: |
          pkg install -y sudo node npm bash
          npm -v
          node -v
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
          # The prepare script patches tsgo/oxlint native binaries which do not exist for the BSDs
          npm pkg delete scripts.prepare
          pnpm install
          chmod +x ./src/*
          kldload linux64
          pnpm test
